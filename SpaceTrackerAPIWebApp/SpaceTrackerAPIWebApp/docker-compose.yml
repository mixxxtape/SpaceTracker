
services:
  db:
    image: postgres:16-alpine
    container_name: spacetracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: SpaceTrackerDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dasha2007
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spacetracker-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >
        Host=db;Port=5432;Database=SpaceTrackerDB;
        Username=postgres;Password=dasha2007
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: